# Baut Blaubuch für Windows und macOS.
#
# Warum überhaupt: ein .dmg lässt sich nur auf macOS erzeugen, ein
# .exe-Installer sinnvoll nur auf Windows. Wer beides ausliefern will,
# braucht beide Maschinen — hier übernimmt das GitHub.
#
# Bei jedem Push läuft die Prüfung. Ein Tag wie v1.0.0 erzeugt zusätzlich
# die fertigen Dateien und hängt sie an einen Release-Entwurf.

name: Bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    name: Prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron wird zum Prüfen nicht gebraucht — der Rechenkern, der Tresor
      # und die Ablage laufen auf blossem Node. Spart rund 200 MB Download.
      - run: npm ci --ignore-scripts
      - run: npm run check:secrets
      - run: npm run check:farben
      - run: npm test

  bauen:
    name: Bauen (${{ matrix.name }})
    needs: pruefen
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bewusst in einzelne Schritte zerlegt: schlägt etwas fehl, sagt schon
      # der Name des Schritts, wo — ohne dass man das Protokoll öffnen muss.
      - name: Schriften und Symbole erzeugen
        run: npm run assets

      - name: Windows — portable .exe
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Bis 1.0.3 wurde zusaetzlich ein .zip gebaut — urspruenglich als
      # Rueckversicherung, falls das .dmg an den Werkzeugen des Laeufers
      # scheitert. Beide enthalten dieselbe App; das .zip ist eigentlich fuer
      # automatische Aktualisierung gedacht, die Blaubuch nicht hat. Seit die
      # Signatur sitzt, ist das .dmg zuverlaessig — das .zip verdoppelte nur
      # die Last: 436 MB je Durchlauf statt 218.
      #
      # --arm64 --x64 muss ausgeschrieben werden. Ein Ziel auf der
      # Kommandozeile ersetzt die Zielliste aus package.json samt der dort
      # genannten Architekturen; ohne die Angabe baut electron-builder nur
      # für die Architektur des Läufers. macos-latest ist Apple Silicon —
      # v1.0.1 kam deshalb ohne Intel-Dateien heraus, obwohl jeder Schritt
      # als erfolgreich galt.
      - name: macOS — .dmg (arm64 und x64)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Beweist, was sonst nur behauptet wäre: dass die Ad-hoc-Signatur aus
      # tools/adhoc-sign.js sitzt und dass wirklich beide Architekturen
      # vorliegen. Ohne Signatur startet das Programm auf Apple Silicon nicht
      # und meldet „beschädigt“ — das soll hier auffallen und nicht beim
      # Anwender.
      - name: macOS — Signatur und Architekturen prüfen
        if: matrix.os == 'macos-latest'
        run: |
          set -eu
          gefunden=0
          for app in dist/*/Blaubuch.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"

            beleg=$(codesign -dv --verbose=4 "$app" 2>&1)
            echo "$beleg" | grep -E "Identifier|Format|Sealed Resources|Info.plist" || true

            # Drei Werte, an denen v1.0.1 erkennbar gewesen wäre. Es reicht
            # nicht, dass codesign --verify durchläuft: eine Restsignatur des
            # Electron-Downloads besteht die Prüfung für sich genommen, deckt
            # aber weder Ressourcen noch Info.plist ab.
            ident=$(echo "$beleg" | sed -n "s/^Identifier=//p")
            if [ "$ident" != "ch.jjlabs.blaubuch" ]; then
              echo "FEHLER: Identifier ist '$ident', erwartet ch.jjlabs.blaubuch."
              echo "Ein Identifier wie 'Electron' heisst: das Bundle wurde nie neu signiert."
              exit 1
            fi

            if echo "$beleg" | grep -q "^Sealed Resources=none"; then
              echo "FEHLER: Sealed Resources=none — die Ressourcen sind nicht mitsigniert."
              exit 1
            fi

            if echo "$beleg" | grep -q "Info.plist=not bound"; then
              echo "FEHLER: Info.plist ist nicht mitsigniert."
              exit 1
            fi

            lipo -archs "$app/Contents/MacOS/Blaubuch"
            gefunden=$((gefunden + 1))
          done
          test "$gefunden" -eq 2 || { echo "Erwartet: zwei Programmordner (arm64 und x64), gefunden: $gefunden"; exit 1; }

      - name: macOS — zwei Dateien erwartet
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          ls -1 dist/*.dmg
          anzahl=$(ls -1 dist/*.dmg | wc -l | tr -d ' ')
          test "$anzahl" -eq 2 || { echo "Erwartet: 2 x .dmg (arm64 und x64), gefunden: $anzahl"; exit 1; }

      # Artefakte kosten Platz und nuetzen nur, wenn sie die einzige Kopie
      # sind. Bei einem Tag haengen dieselben Dateien am Release — dort waeren
      # sie reine Verdopplung. 13 Durchlaeufe hatten so 5 GiB belegt.
      #
      # Deshalb: bei einem Tag nur, wenn etwas schiefging (dann ist das
      # Teilergebnis das Einzige, was man in der Hand hat). Sonst immer, aber
      # nur fuenf Tage — laenger schaut ohnehin niemand hinein.
      - name: Ergebnis sichern
        if: ${{ always() && (failure() || !startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v4
        with:
          name: blaubuch-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: warn
          retention-days: 5

      - name: An den Release-Entwurf hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
          body: |
            Keine der Fassungen trägt ein Entwicklerzertifikat. Beide
            Systeme warnen deshalb beim ersten Start.

            **Windows** — SmartScreen: *Weitere Informationen →
            Trotzdem ausführen*.

            **macOS** — App nach *Programme* ziehen, dann öffnen. Meldet das
            System, der Entwickler lasse sich nicht verifizieren:
            **Systemeinstellungen → Datenschutz & Sicherheit**, dort unten
            auf **Trotzdem öffnen**.

            Meldet es stattdessen, die App sei **beschädigt**, ist es eine
            Fassung bis 1.0.1. Die war fehlerhaft verpackt; das Entfernen der
            Quarantänemarkierung allein behebt das nicht. Nimm 1.0.2 oder neuer.

            Die App trägt eine Ad-hoc-Signatur. Sie sorgt dafür, dass das
            Programm auf Apple Silicon überhaupt startet — sie sagt nichts
            darüber aus, wer es gebaut hat.
